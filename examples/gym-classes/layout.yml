# yaml-language-server: $schema=https://signagekit.514sid.com/schema.json
# Pulse Fitness Leeds, reception wall. Landscape, dark with a hot accent.
colors:
  scheme: dark
  accent: '#f97316'

layout:
  design: landscape
  flow:
    - { zone: head, span: 8, height: 170px }
    - { zone: clock, span: 4, height: 170px }
    - { zone: classes, span: 8, height: 4 }
    - { zone: next, span: 4, height: 4 }
    - { zone: ticker, height: 110px }

zones:
  head: { type: heading, text: Classes today }
  clock: { type: clock, surface: raised, hour12: false }
  classes:
    type: table
    columns: [Time, Class, Studio, Coach, Spots]
    align: [start, start, start, start, end]
    widths: [1.1, 2.6, 1.4, 1.8, 1.3]
    page_rows: 7
    seconds: 12
    rows: { bind: /classes }
  next:
    type: stack
    items:
      - type: countdown
        weight: 2
        title: Next class
        label: { bind: /next_label }
        to: { bind: /next_at }
        done: Starting now
      - type: stat
        weight: 2
        title: Studio 1 spots
        value: { bind: /spots_left }
        unit: left
        thresholds: { warning: 5, danger: 2 }
        label: { bind: /spots_label }
  ticker:
    type: cycle
    surface: raised
    seconds: 8
    items: { bind: /messages }
