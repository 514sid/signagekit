name: Publish to npm

# Publishing a GitHub release publishes that version to npm. It uses npm's
# trusted publishing: GitHub proves the run's identity, so no npm token is
# stored here, and npm records provenance linking the release to this commit.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # A release tagged v0.2.0 must publish version 0.2.0, nothing else.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      # Staged publishing, which npm may apply to any publish, needs npm 11.15.0
      # or newer; trusted publishing needs 11.5.1.
      - run: npm install -g npm@11.21.1
      # A release for a version already on npm (or still being processed
      # there) is a record on GitHub only, not a failure. prepublishOnly runs
      # every check and the build first.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm, nothing to publish"
            exit 0
          fi
          if ! npm publish --access public 2>&1 | tee publish.log; then
            if grep -q "cannot publish over the previously published" publish.log; then
              echo "${name}@${version} is already on npm, nothing to publish"
              exit 0
            fi
            exit 1
          fi
